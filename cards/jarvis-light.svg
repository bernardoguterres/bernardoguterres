<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 270" width="490" height="270" role="img" aria-labelledby="title desc">
<title id="title">Jarvis</title>
<desc id="desc">Jarvis: a local-first macOS assistant with persistent memory that asks for confirmation before any external action.</desc>
<style>@font-face{font-family:'BG Plex Mono';font-weight:500;font-style:normal;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'BG Newsreader';font-weight:400;font-style:normal;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'BG Source Sans';font-weight:400;font-style:normal;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'BG Plex Mono';font-weight:400;font-style:normal;src:url(data:font/woff;base64,) format('woff')}.serif{font-family:'BG Newsreader',Georgia, 'Times New Roman', serif;font-weight:400}.sans{font-family:'BG Source Sans',-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;font-weight:400}.mono{font-family:'BG Plex Mono',ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-weight:400}.mono5{font-family:'BG Plex Mono',ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-weight:500}.still{display:none}.draw{stroke-dasharray:1;animation:draw 1.2s ease-in-out both}@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}.ping{transform-box:fill-box;transform-origin:50% 50%;animation:ping 1.2s ease-out both}@keyframes ping{0%{opacity:0;transform:scale(.96)}30%{opacity:.9}100%{opacity:0;transform:scale(1.04)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.motion{display:none}.still{display:inline}}</style>
<rect x="1" y="1" width="488" height="268" rx="16" fill="#fbf8f2" stroke="#e1d8c8" stroke-width="1.5"/>
<text x="32" y="48" class="mono5" font-size="12.5" fill="#91301f" letter-spacing="1.5">LOCAL-FIRST AI</text>
<text x="30" y="94" class="serif" font-size="40" fill="#1d1610">Jarvis</text>
<text x="32" y="126" class="sans" font-size="19" fill="#5f574c">macOS assistant with persistent memory</text>
<g><circle cx="42" cy="166" r="4.5" fill="#91301f" opacity="1"/><circle cx="66" cy="158" r="4.5" fill="#91301f" opacity="0.75"/><circle cx="60" cy="184" r="4.5" fill="#91301f" opacity="0.55"/><path d="M42 166 L66 158 L60 184 Z" fill="none" stroke="#91301f" opacity=".5"/></g>
<text x="90" y="177" class="mono" font-size="14" fill="#1d1610">memory stays on this Mac</text>
<g><rect x="30" y="204" width="430" height="40" rx="9" fill="#f1e9dc" stroke="#e1d8c8"/></g>
<text x="48" y="229" class="mono" font-size="14" fill="#5f574c">external action?</text>
<text x="444" y="229" class="mono5" font-size="14" fill="#91301f" text-anchor="end">confirm first →</text>
<rect class="ping" x="30" y="204" width="430" height="40" rx="9" fill="none" stroke="#b8532f" stroke-width="1.6" opacity="0" style="animation-delay:4.20s"/>
</svg>
