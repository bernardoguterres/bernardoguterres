<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 170" width="300" height="170" role="img" aria-labelledby="title desc">
<title id="title">LinkedIn</title>
<desc id="desc">LinkedIn link tile (in/bernardoguterres).</desc>
<style>@font-face{font-family:'BG Plex Mono';font-weight:500;font-style:normal;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'BG Source Sans';font-weight:600;font-style:normal;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'BG Newsreader';font-weight:400;font-style:normal;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'BG Source Sans';font-weight:400;font-style:normal;src:url(data:font/woff;base64,) format('woff')}.serif{font-family:'BG Newsreader',Georgia, 'Times New Roman', serif;font-weight:400}.sans{font-family:'BG Source Sans',-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;font-weight:400}.sans6{font-family:'BG Source Sans',-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;font-weight:600}.mono5{font-family:'BG Plex Mono',ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-weight:500}.still{display:none}.draw{stroke-dasharray:1;animation:draw 1.2s ease-in-out both}@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}.ring{transform-box:fill-box;transform-origin:50% 50%;animation:ring .8s cubic-bezier(.2,.9,.25,1.15) both}@keyframes ring{0%{opacity:0;transform:translateY(6px) rotate(-2.5deg)}60%{opacity:.55;transform:rotate(.7deg)}100%{opacity:.55;transform:none}}.sheen{animation:sheen 1.1s ease-in-out both}@keyframes sheen{from{transform:translateX(-340px)}to{transform:translateX(340px)}}.nudge{animation:nudge .5s ease-in-out 2 alternate both}@keyframes nudge{from{transform:none}to{transform:translate(4px,-4px)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.motion{display:none}.still{display:inline}}</style>
<rect x="1" y="1" width="298" height="168" rx="16" fill="#1d1610" stroke="#3a2f25" stroke-width="1.5"/>
<g>
<rect class="ring" x="10" y="10" width="280" height="150" rx="12" fill="none" stroke="#df825e" stroke-width="1.2" opacity=".55" style="animation-delay:2.76s"/>
<defs><linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#f0a27f" stop-opacity="0"/><stop offset=".5" stop-color="#f0a27f" stop-opacity=".22"/><stop offset="1" stop-color="#f0a27f" stop-opacity="0"/></linearGradient><clipPath id="cp"><rect x="10" y="10" width="280" height="150" rx="12"/></clipPath></defs><g clip-path="url(#cp)"><rect class="sheen" x="0" y="0" width="160" height="170" fill="url(#sh)" transform="translate(-340 0)" style="animation-delay:3.26s"/></g>
