<style>@font-face{font-family:'BG Plex Mono';font-weight:500;font-style:normal;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'BG Source Sans';font-weight:600;font-style:normal;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'BG Newsreader';font-weight:400;font-style:normal;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'BG Newsreader';font-weight:500;font-style:normal;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'BG Plex Mono';font-weight:400;font-style:normal;src:url(data:font/woff;base64,) format('woff')}.serif{font-family:'BG Newsreader',Georgia, 'Times New Roman', serif;font-weight:400}.serif5{font-family:'BG Newsreader',Georgia, 'Times New Roman', serif;font-weight:500}.sans6{font-family:'BG Source Sans',-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;font-weight:600}.mono{font-family:'BG Plex Mono',ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-weight:400}.mono5{font-family:'BG Plex Mono',ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-weight:500}.still{display:none}.draw{stroke-dasharray:1;animation:draw 1.2s ease-in-out both}@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}.ring{transform-box:fill-box;transform-origin:50% 50%;animation:ring .8s cubic-bezier(.2,.9,.25,1.15) both}@keyframes ring{0%{opacity:0;transform:translateY(6px) rotate(-2.5deg)}60%{opacity:.55;transform:rotate(.7deg)}100%{opacity:.55;transform:none}}.sheen{animation:sheen 1.1s ease-in-out both}@keyframes sheen{from{transform:translateX(-340px)}to{transform:translateX(340px)}}.nudge{animation:nudge .5s ease-in-out 2 alternate both}@keyframes nudge{from{transform:none}to{transform:translate(4px,-4px)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.motion{display:none}.still{display:inline}}</style>
